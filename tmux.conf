# : << EOF
# -- user customizations -------------------------------------------------------
# this is the place to override or undo settings

# increase history size
set -g history-limit 20000

# start with mouse mode enabled
set -g mouse on

# force Vi mode
#   really you should export VISUAL or EDITOR environment variable, see manual
#set -g status-keys vi
# set -g mode-keys vi

# I'm ok with C-b
# replace C-b by C-a instead of using both prefixes
# set -gu prefix2
# unbind C-a
# unbind C-b
# bind C-a send-prefix

# key-binding ----------
setw -g xterm-keys on
set -g extended-keys on
set -g extended-keys-format csi-u

# pane resizing not work
# HJKL conflict with aerospace
bind H resize-pane -L 12
bind J resize-pane -D 12
bind K resize-pane -U 12
bind L resize-pane -R 12

# pane slecting
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind > swap-pane -D
bind < swap-pane -U

# switch panes using hjkl
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# split panes using -
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key C-l last-window

set -g mode-keys vi

bind r source-file ~/.tmux.conf \; display 'Reloaded!'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# status bar
set -g @plugin 'thewtex/tmux-mem-cpu-load'
# theming
set -g @plugin 'niksingh710/minimal-tmux-status'
# These are the default values used inside the plugin to acheive the preview shown above.

set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-indicator-str " tmux "
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "bottom"

# Enables or disables the left and right status bar
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true

# expanded icon (fullscreen icon)
set -g @minimal-tmux-expanded-icon " 󰊓 "

# on all tabs (default is false)
# false will make it visible for the current tab only
set -g @minimal-tmux-show-expanded-icon-for-all-tabs true

# To add or remove extra text in status bar
set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-left-extra "[#S] "


# Not recommended to change these values
set -g @minimal-tmux-status-right '#{?#{e|<:#{client_width},140},%H:%M,#(~/.tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load -i 5 -g 4 -a 1) | %a %h-%d %H:%M}'
set -g @minimal-tmux-status-left ""


# If getting strings cut in left status or right
# Here 20 is the length of the characters in the string
# set -g status-right-length 20
set -g status-left-length 20
set -g status-right-length 200


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Keep full names; tmux scrolls the window list around the active window.
set -g automatic-rename on
set -g allow-rename off
set -g @window-process '#{?#{&&:#{==:#{pane_current_command},node},#{m:π - *,#{pane_title}}},pi,#{pane_current_command}}'
set -g automatic-rename-format '#{b:pane_current_path} · #{E:@window-process}'

set -g @minimal-tmux-window-status-format ' #I:#{b:pane_current_path} · #{E:@window-process} '

# Search all panes; keep the native session tree on uppercase W.
bind w run-shell -b 'tmux -S #{q:socket_path} display-popup -c #{q:client_name} -E -w 90% -h 80% -T " Find directory / process " -e TMUX_PICKER_CLIENT=#{q:client_name} -e TMUX_PICKER_SOCKET=#{q:socket_path} "python3 \"\$HOME/.dotfiles/tmux/window-picker.py\""'
bind W choose-tree -Zw -O name -F '#{?pane_format,#{pane_current_path} · #{E:@window-process},#{?window_format,#{window_name}  #{pane_current_path},#{session_windows} windows}}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
